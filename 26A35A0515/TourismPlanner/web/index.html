<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Tourism Planner - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Tourism Planner</h1>

        <p class="subtitle">
            Plan your perfect journey
        </p>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                required>

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

        <p>
            New user?
            <a href="register.html">
                Create Account
            </a>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
