<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Register - Tourism Planner</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p class="subtitle">
            Join Tourism Planner
        </p>

        <form id="registerForm">

            <input
                type="text"
                id="registerName"
                placeholder="Full Name"
                required>

            <input
                type="email"
                id="registerEmail"
                placeholder="Email"
                required>

            <input
                type="password"
                id="registerPassword"
                placeholder="Password"
                required>

            <button type="submit">
                Register
            </button>

        </form>

        <p id="registerMessage"></p>

        <p>
            Already have an account?
            <a href="index.html">
                Login
            </a>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
